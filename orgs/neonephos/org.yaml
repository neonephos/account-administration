# Peribolos configuration for the NeoNephos org.
#
# Manages ONLY org membership and teams. peribolos runs with --fix-org-members
# --fix-teams --fix-team-members (no --fix-org, no --fix-repos), so org
# settings and repositories are intentionally NOT managed here.
#
# GENERATED with `peribolos --dump-full` from the LIVE org, then trimmed to
# admins/members/teams and reviewed. This is the SINGLE SOURCE OF TRUTH: on
# apply, the membership lists here are authoritative (a user/team removed here
# is removed on GitHub).
#
# Teams are keyed by their DISPLAY NAME (not slug), matching peribolos' model.
#
# See ../../docs/peribolos-setup.md
