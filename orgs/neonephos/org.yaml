# Peribolos configuration for the NeoNephos org.
#
# Manages org settings, membership, teams, and team repo permissions. peribolos
# runs with --fix-org --fix-org-members --fix-teams --fix-team-members
# --fix-team-repos (no --fix-repos, no --fix-collaborators), so repositories
# themselves and direct repo collaborators are NOT managed here.
#
# GENERATED with `peribolos --dump-full` from the LIVE org, then trimmed to
# settings/admins/members/teams and reviewed. This is the SINGLE SOURCE OF
# TRUTH: on apply, the lists here are authoritative (a user/team removed here
# is removed on GitHub, and a repo dropped from a team's `repos:` block has
# that team's access revoked).
#
# Teams are keyed by their DISPLAY NAME (not slug), matching peribolos' model.
#
# See ../../docs/peribolos-setup.md
orgs:
  neonephos:
    # Org settings (--fix-org). Only fields listed here are managed; omitted
    # ones keep whatever GitHub has. Keep this block minimal: peribolos treats
    # an empty string as a desired value, so listing `company: ''` against a
    # null on GitHub produces an EditOrg call on every single run.
    #
    # default_repository_permission: none means org membership alone grants NO
    # access to private repos — access is explicit, via the team `repos:` blocks
    # below or direct collaborators. Repos holding personal data (contactlist)
    # depend on this. Internal repos keep a read floor for enterprise members
    # regardless of this setting.
    default_repository_permission: none
