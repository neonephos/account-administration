# Build a multi-arch (amd64 + arm64) peribolos image and push it to GHCR.
#
# Upstream (us-docker.pkg.dev/k8s-infra-prow/images/peribolos) is amd64-only,
# which pins the reconcile job to amd64 runners. This rebuilds the same pinned
# prow source for both architectures and publishes:
#   ghcr.io/neonephos/account-administration/peribolos:<version>
#   ghcr.io/neonephos/account-administration/peribolos:latest
#
# Bump PROW_VERSION/PROW_REF below to track a newer upstream peribolos, then let
# this run; afterwards point Taskfile.yml PERIBOLOS_IMAGE at the new tag.
name: build-peribolos

on:
  push:
    branches: [main]
    paths:
      - "images/peribolos/**"
      - ".github/workflows/build-peribolos.yml"
  workflow_dispatch:

# Pin the upstream peribolos we mirror. PROW_REF is the full commit sha;
# PROW_VERSION mirrors the upstream image tag (vYYYYMMDD-<shortsha>).
env:
  PROW_VERSION: v20260821-a61940897
  PROW_REF: a619408973827f5a8846fc61b4731156bde5fb0c
  IMAGE: ghcr.io/neonephos/account-administration/peribolos

permissions:
  contents: read
  packages: write

concurrency:
  group: build-peribolos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU (for arm64 emulation during build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PROW_VERSION }}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/peribolos
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROW_REF=${{ env.PROW_REF }}
            PROW_VERSION=${{ env.PROW_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
