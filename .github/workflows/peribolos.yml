# Peribolos reconciliation for NeoNephos orgs.
#
# One workflow, both modes:
#   - On pull_request  -> DRY-RUN (CONFIRM=false). Never mutates GitHub; a green
#     check is the review signal (the full plan is in the job log).
#   - On push to main  -> APPLY (CONFIRM=true). Mutates GitHub org state.
#   - workflow_dispatch -> APPLY (manual).
#
# The org matrix is discovered dynamically from orgs/*/org.yaml, so onboarding a
# new org is just adding its org.yaml — no workflow edit.
#
# Auth: uses a GitHub App (recommended over a PAT). Configure repo/org secrets:
#   PERIBOLOS_APP_ID           - the GitHub App's Client ID (e.g. Iv23li...)
#   PERIBOLOS_APP_PRIVATE_KEY  - the App's private key (PEM)
# The App must be installed on each managed org with:
#   Organization > Members: Read and write
#   Organization > Administration: Read and write
name: peribolos

on:
  pull_request:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Taskfile.yml"
      - ".taskrc.yml"
      - "admin/**"
      - ".github/workflows/peribolos.yml"
  push:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Taskfile.yml"
      - ".taskrc.yml"
      - "admin/**"
      - ".github/workflows/peribolos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two applies race against the same org state. Keyed per event type
  # so a PR dry-run doesn't block a main apply.
  group: peribolos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on ubuntu-slim (1 vCPU single-CPU runner) — cheaper for this
  # lightweight discovery job (just find + jq). NOTE: slim runners have the
  # Docker CLI but no Docker daemon, so the reconcile job below (which runs
  # peribolos via `docker run`) must stay on a standard runner. There is also
  # no ubuntu-slim ARM variant.
  #
  # Discover the orgs to reconcile by listing orgs/*/org.yaml, and emit them as
  # a JSON array for the matrix below.
  discover-orgs:
    runs-on: ubuntu-slim
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: List org configs
        id: list
        run: |
          orgs=$(find orgs -mindepth 2 -maxdepth 2 -name org.yaml -printf '%h\n' \
            | xargs -r -n1 basename \
            | sort \
            | jq -R . | jq -sc .)
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
          echo "discovered orgs: $orgs"

  reconcile:
    needs: discover-orgs
    # Standard runner: peribolos runs via `docker run`, which needs a Docker
    # daemon that ubuntu-slim does not provide.
    runs-on: ubuntu-latest
    # Apply only on push to main / manual dispatch; pull_request is a dry-run.
    # The environment gate applies its required-reviewers only on those apply
    # runs — set it up in repo settings (Environments > peribolos-apply).
    environment: ${{ github.event_name != 'pull_request' && 'peribolos-apply' || '' }}
    strategy:
      fail-fast: false
      # Applies run one org at a time; PR dry-runs can fan out freely.
      max-parallel: ${{ github.event_name != 'pull_request' && 1 || 256 }}
      matrix:
        org: ${{ fromJSON(needs.discover-orgs.outputs.orgs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Validate config
        run: task validate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # PERIBOLOS_APP_ID holds the App's Client ID (e.g. Iv23li...), which
          # GitHub now recommends over the numeric App ID.
          client-id: ${{ secrets.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      # CONFIRM=true only when NOT a pull_request (i.e. push to main / dispatch).
      # The token is passed via env (not interpolated into the run: string) and
      # the Taskfile picks up GITHUB_TOKEN from the environment by default.
      - name: Peribolos reconcile
        env:
          CONFIRM: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: task reconcile ORG=${{ matrix.org }} CONFIRM="$CONFIRM"
