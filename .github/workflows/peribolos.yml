# Peribolos reconciliation for NeoNephos orgs.
#
# One workflow, both modes:
#   - On pull_request_target -> DRY-RUN (CONFIRM=false). Never mutates GitHub; a
#     green check is the review signal (the full plan is in the job log).
#   - On push to main  -> APPLY (CONFIRM=true). Mutates GitHub org state.
#   - workflow_dispatch -> APPLY (manual).
#
# Why pull_request_target (not pull_request): org.yaml PRs come from community
# forks, and fork-triggered `pull_request` runs get NO repo secrets — so the
# GitHub App token step fails and the dry-run can't talk to GitHub at all.
# `pull_request_target` runs in the BASE repo context, where secrets ARE
# available for fork PRs.
#
# SECURITY: pull_request_target exposes secrets, so we MUST NOT execute any
# fork-controlled code. The reconcile job therefore:
#   1. Checks out the trusted BASE ref (its Taskfile, workflow, admin scripts).
#   2. Overlays ONLY the PR's orgs/**/org.yaml *data* files (pure YAML that
#      peribolos parses — never executed) via `git checkout <pr-sha> -- orgs`.
# It never checks out or runs the fork's Taskfile.yml / admin/** / workflow.
#
# The org matrix is discovered dynamically from orgs/*/org.yaml, so onboarding a
# new org is just adding its org.yaml — no workflow edit.
#
# Auth: uses a GitHub App (recommended over a PAT). Configure repo/org secrets:
#   PERIBOLOS_APP_ID           - the GitHub App's Client ID (e.g. Iv23li...)
#   PERIBOLOS_APP_PRIVATE_KEY  - the App's private key (PEM)
# The App must be installed on each managed org with:
#   Organization > Members: Read and write
#   Organization > Administration: Read and write
name: peribolos

on:
  pull_request_target:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Taskfile.yml"
      - ".taskrc.yml"
      - "admin/**"
      - ".github/workflows/peribolos.yml"
  push:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Taskfile.yml"
      - ".taskrc.yml"
      - "admin/**"
      - ".github/workflows/peribolos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two applies race against the same org state. Keyed per event type
  # so a PR dry-run doesn't block a main apply.
  group: peribolos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on ubuntu-slim (1 vCPU single-CPU runner) — cheaper for this
  # lightweight discovery job (just find + jq). NOTE: slim runners have the
  # Docker CLI but no Docker daemon, so the reconcile job below (which runs
  # peribolos via `docker run`) must stay on a standard runner. There is also
  # no ubuntu-slim ARM variant.
  #
  # Discover the orgs to reconcile by listing orgs/*/org.yaml, and emit them as
  # a JSON array for the matrix below.
  discover-orgs:
    runs-on: ubuntu-slim
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - name: Checkout base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # SECURITY (pull_request_target): overlay ONLY the fork PR's org.yaml data
      # so a PR that adds a brand-new org dir is still discovered & dry-run.
      # Pure YAML data — never fork code. No-op on push/dispatch.
      - name: Overlay PR org configs
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          got=$(git rev-parse FETCH_HEAD)
          if [ "$got" != "$PR_SHA" ]; then
            echo "::error::PR head moved during run (expected $PR_SHA, got $got); refusing to dry-run stale/mismatched data"
            exit 1
          fi
          git checkout "$PR_SHA" -- orgs

      - name: List org configs
        id: list
        run: |
          orgs=$(find orgs -mindepth 2 -maxdepth 2 -name org.yaml -printf '%h\n' \
            | xargs -r -n1 basename \
            | sort \
            | jq -R . | jq -sc .)
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
          echo "discovered orgs: $orgs"

  reconcile:
    needs: discover-orgs
    # Standard runner: peribolos runs via `docker run`, which needs a Docker
    # daemon that ubuntu-slim does not provide.
    runs-on: ubuntu-latest
    # Apply only on push to main / manual dispatch; pull_request_target is a
    # dry-run. The environment gate applies its required-reviewers only on those
    # apply runs — set it up in repo settings (Environments > peribolos-apply).
    environment: ${{ github.event_name != 'pull_request_target' && 'peribolos-apply' || '' }}
    strategy:
      fail-fast: false
      # Applies run one org at a time; PR dry-runs can fan out freely.
      max-parallel: ${{ github.event_name != 'pull_request_target' && 1 || 256 }}
      matrix:
        org: ${{ fromJSON(needs.discover-orgs.outputs.orgs) }}
    steps:
      - name: Checkout base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # SECURITY (pull_request_target): overlay ONLY the fork PR's org.yaml data
      # onto the trusted base checkout, so peribolos dry-runs the PROPOSED config
      # without ever checking out or executing fork code (Taskfile/admin/**).
      # Pure YAML data. No-op on push/dispatch.
      - name: Overlay PR org configs
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
          got=$(git rev-parse FETCH_HEAD)
          if [ "$got" != "$PR_SHA" ]; then
            echo "::error::PR head moved during run (expected $PR_SHA, got $got); refusing to dry-run stale/mismatched data"
            exit 1
          fi
          git checkout "$PR_SHA" -- orgs

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Validate config
        run: task validate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # PERIBOLOS_APP_ID holds the App's Client ID (e.g. Iv23li...), which
          # GitHub now recommends over the numeric App ID.
          client-id: ${{ secrets.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      # CONFIRM=true only when NOT a dry-run (i.e. push to main / dispatch).
      # The token is passed via env (not interpolated into the run: string) and
      # the Taskfile picks up GITHUB_TOKEN from the environment by default.
      - name: Peribolos reconcile
        env:
          CONFIRM: ${{ github.event_name != 'pull_request_target' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: task reconcile ORG=${{ matrix.org }} CONFIRM="$CONFIRM"
