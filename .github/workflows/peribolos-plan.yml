# Dry-run Peribolos on pull requests.
#
# This never mutates GitHub. The job succeeds only if the dry-run is clean, so a
# green check is the review signal (the full plan is in the job log).
#
# Auth: uses a GitHub App (recommended over a PAT). Configure repo/org secrets:
#   PERIBOLOS_APP_ID           - the GitHub App's Client ID (e.g. Iv23li...)
#   PERIBOLOS_APP_PRIVATE_KEY  - the App's private key (PEM)
# The App must be installed on each managed org with:
#   Organization > Members: Read and write
#   Organization > Administration: Read and write
name: peribolos-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Taskfile.yml"
      - "admin/**"
      - ".github/workflows/peribolos-*.yml"

permissions:
  contents: read

jobs:
  # Discover the orgs to plan by listing orgs/*/org.yaml, and emit them as a
  # JSON array for the matrix below. Adding orgs/<org>/org.yaml is all it takes
  # to onboard a new org — no workflow edit needed.
  discover-orgs:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: List org configs
        id: list
        run: |
          orgs=$(find orgs -mindepth 2 -maxdepth 2 -name org.yaml -printf '%h\n' \
            | xargs -r -n1 basename \
            | sort \
            | jq -R . | jq -sc .)
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
          echo "discovered orgs: $orgs"

  plan:
    needs: discover-orgs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.discover-orgs.outputs.orgs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x

      - name: Validate config
        run: task validate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # PERIBOLOS_APP_ID holds the App's Client ID (e.g. Iv23li...), which
          # GitHub now recommends over the numeric App ID.
          client-id: ${{ secrets.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      - name: Peribolos dry-run
        run: task plan ORG=${{ matrix.org }} GITHUB_TOKEN=${{ steps.app-token.outputs.token }}
