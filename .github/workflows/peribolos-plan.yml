# Dry-run Peribolos on pull requests and post the plan.
#
# This never mutates GitHub. It shows maintainers/reviewers exactly what the
# apply step would do once the PR is merged.
#
# Auth: uses a GitHub App (recommended over a PAT). Configure repo/org secrets:
#   PERIBOLOS_APP_ID           - the GitHub App's App ID
#   PERIBOLOS_APP_PRIVATE_KEY  - the App's private key (PEM)
# The App must be installed on each managed org with:
#   Organization > Members: Read and write
#   Organization > Administration: Read and write
name: peribolos-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Makefile"
      - "admin/**"
      - ".github/workflows/peribolos-*.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One dry-run per org config. Add orgs here as they onboard.
      matrix:
        org:
          - neonephos
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate config
        run: make validate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # PERIBOLOS_APP_ID holds the App's Client ID (e.g. Iv23li...), which
          # GitHub now recommends over the numeric App ID.
          client-id: ${{ secrets.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      - name: Peribolos dry-run
        id: dryrun
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          make plan ORG=${{ matrix.org }} 2>&1 | tee /tmp/plan-${{ matrix.org }}.log

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ORG: ${{ matrix.org }}
        with:
          script: |
            const fs = require('fs');
            const org = process.env.ORG;
            let body;
            try {
              const log = fs.readFileSync(`/tmp/plan-${org}.log`, 'utf8').slice(-60000);
              body = `### Peribolos dry-run for \`${org}\`\n\n<details><summary>plan output</summary>\n\n\`\`\`\n${log}\n\`\`\`\n\n</details>`;
            } catch (e) {
              body = `### Peribolos dry-run for \`${org}\`\n\n:warning: could not read plan output.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
