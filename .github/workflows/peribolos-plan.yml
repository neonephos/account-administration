# Dry-run Peribolos on pull requests.
#
# This never mutates GitHub. The job succeeds only if the dry-run is clean, so a
# green check is the review signal (the full plan is in the job log).
#
# Auth: uses a GitHub App (recommended over a PAT). Configure repo/org secrets:
#   PERIBOLOS_APP_ID           - the GitHub App's Client ID (e.g. Iv23li...)
#   PERIBOLOS_APP_PRIVATE_KEY  - the App's private key (PEM)
# The App must be installed on each managed org with:
#   Organization > Members: Read and write
#   Organization > Administration: Read and write
name: peribolos-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "orgs/**/org.yaml"
      - "Makefile"
      - "admin/**"
      - ".github/workflows/peribolos-*.yml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One dry-run per org config. Add orgs here as they onboard.
      matrix:
        org:
          - neonephos
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate config
        run: make validate

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # PERIBOLOS_APP_ID holds the App's Client ID (e.g. Iv23li...), which
          # GitHub now recommends over the numeric App ID.
          client-id: ${{ secrets.PERIBOLOS_APP_ID }}
          private-key: ${{ secrets.PERIBOLOS_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      - name: Peribolos dry-run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: make plan ORG=${{ matrix.org }}
