# Organization-wide repository defaults for neonephos
# Applied to all repos unless overridden in repos/*.yml or suborgs/*.yml
# Docs: https://github.com/github/safe-settings

repository:
  auto_init: true
  default_branch: main
  has_issues: true
  has_projects: true
  has_wiki: false

  # Merge strategy
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  allow_auto_merge: false
  delete_branch_on_merge: true
  allow_update_branch: true

  # Security
  security:
    enableVulnerabilityAlerts: true
    enableAutomatedSecurityFixes: true

labels:
  include:
    - name: bug
      color: "d73a4a"
      description: Something isn't working
    - name: enhancement
      color: "a2eeef"
      description: New feature or request
    - name: documentation
      color: "0075ca"
      description: Improvements or additions to documentation
    - name: good first issue
      color: "7057ff"
      description: Good for newcomers
    - name: help wanted
      color: "008672"
      description: Extra attention is needed
    - name: question
      color: "d876e3"
      description: Further information is requested
    - name: wontfix
      color: "ffffff"
      description: This will not be worked on
    - name: duplicate
      color: "cfd3d7"
      description: This issue or pull request already exists
    - name: invalid
      color: "e4e669"
      description: This doesn't seem right

teams:
  - name: governing-board
    permission: admin

  - name: tac
    permission: push

  - name: website
    permission: push
    include:
      - website
      - website_poc
      - neonephos_website

branches:
  - name: default
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        require_last_push_approval: false
      required_status_checks: null
      enforce_admins: false
      restrictions: null

# Org-level rulesets (the only org-level setting safe-settings supports)
# See https://docs.github.com/en/rest/orgs/rules
rulesets:
  - name: default-branch-protection
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 1
        actor_type: OrganizationAdmin
        bypass_mode: always
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
      repository_name:
        include: ["~ALL"]
        exclude: []
    rules:
      - type: pull_request
        parameters:
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_approving_review_count: 1
          required_review_thread_resolution: false
      - type: deletion
      - type: required_linear_history
