# Peribolos automation for NeoNephos account administration.
#
# Peribolos manages GitHub org settings, teams, and memberships from the YAML
# files under orgs/*/org.yaml. See docs/peribolos-setup.md.
#
# Usage (ORG is a Task variable — pass it after the task name):
#   task validate                   # lint + schema-check all org configs (no network)
#   task dump ORG=neonephos > orgs/neonephos/org.yaml   # seed from live org
#   task reconcile ORG=neonephos    # dry-run (no mutations)
#   task reconcile ORG=neonephos CONFIRM=true   # APPLY changes to GitHub
#
# `reconcile` is the single entry point: dry-run by default, mutating only when
# CONFIRM=true. CI passes CONFIRM=true on push to main (PRs stay dry-run).
#
# Auth: GITHUB_TOKEN is a global variable that defaults to your shell's
# $GITHUB_TOKEN (a token or GitHub App installation token with org admin scope).
# Override with `task ... GITHUB_TOKEN=...`. Tasks that need it inject it into
# their environment; .taskrc.yml enables env-precedence so the injected value
# wins over any stale OS value.
#
# Requires: https://taskfile.dev  (go-task)
version: "3"

vars:
  # GITHUB_TOKEN defaults to the shell environment; override with GITHUB_TOKEN=...
  # See https://taskfile.dev/docs/experiments/env-precedence
  GITHUB_TOKEN: '{{.GITHUB_TOKEN | default (env "GITHUB_TOKEN")}}'
  # Pin the Prow image tag; bump deliberately.
  # Registry: us-docker.pkg.dev/k8s-infra-prow/images (gcr.io/k8s-prow was retired).
  # Tags: https://us-docker.pkg.dev/k8s-infra-prow/images/peribolos
  PERIBOLOS_IMAGE: '{{.PERIBOLOS_IMAGE | default "us-docker.pkg.dev/k8s-infra-prow/images/peribolos:v20260821-a61940897"}}'
  CONFIG_DIR: '{{.CONFIG_DIR | default "orgs"}}'
  # Safety rails (mirror the kubernetes/org defaults).
  MIN_ADMINS: '{{.MIN_ADMINS | default "2"}}'
  MAX_REMOVAL_DELTA: '{{.MAX_REMOVAL_DELTA | default "0.25"}}'
  REQUIRE_SELF: '{{.REQUIRE_SELF | default "false"}}'
  # Whether peribolos actually MUTATES GitHub. Defaults to false so a local
  # `task reconcile` is a safe dry-run; CI overrides CONFIRM=true on push to main.
  CONFIRM: '{{.CONFIRM | default "false"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  validate:
    desc: Validate all org configs are well-formed YAML (no network calls)
    cmds:
      - |
        for f in {{.CONFIG_DIR}}/*/org.yaml; do
          echo "checking $f"
          python3 -c "import sys,yaml; yaml.safe_load(open('$f')); print('  ok')" || exit 1
        done

  dump:
    desc: Dump the live org config to stdout (seed a new org.yaml) — needs ORG=<org>
    requires:
      vars: [ORG]
    env:
      GITHUB_TOKEN: "{{.GITHUB_TOKEN}}"
    preconditions:
      - sh: 'test -n "$GITHUB_TOKEN"'
        msg: "ERROR: GITHUB_TOKEN is not set (export it or pass GITHUB_TOKEN=...)"
    cmds:
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}:/workspace:ro" -w /workspace -e GITHUB_TOKEN
        --entrypoint sh {{.PERIBOLOS_IMAGE}}
        -c 'umask 077; printf %s "$GITHUB_TOKEN" > /tmp/token; exec /ko-app/peribolos --github-token-path /tmp/token "$@"' sh
        --dump "{{.ORG}}"

  # Reconcile: the single entry point. Dry-run by default; peribolos only mutates
  # GitHub when --confirm is present, which we append only when CONFIRM=true.
  reconcile:
    desc: "Reconcile an org (dry-run unless CONFIRM=true) — needs ORG=<org>"
    requires:
      vars: [ORG, GITHUB_TOKEN]
    env:
      GITHUB_TOKEN: "{{.GITHUB_TOKEN}}"
    preconditions:
      - sh: 'test -f "{{.CONFIG_DIR}}/{{.ORG}}/org.yaml"'
        msg: "ERROR: config not found: {{.CONFIG_DIR}}/{{.ORG}}/org.yaml"
      - sh: 'test -n "$GITHUB_TOKEN"'
        msg: "ERROR: GITHUB_TOKEN is not set (export it or pass GITHUB_TOKEN=...)"
    cmds:
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}:/workspace:ro" -w /workspace -e GITHUB_TOKEN
        --entrypoint sh {{.PERIBOLOS_IMAGE}}
        -c 'umask 077; printf %s "$GITHUB_TOKEN" > /tmp/token; exec /ko-app/peribolos --github-token-path /tmp/token "$@"' sh
        --config-path "{{.CONFIG_DIR}}/{{.ORG}}/org.yaml"
        --fix-org --fix-org-members --fix-teams --fix-team-members
        --min-admins={{.MIN_ADMINS}}
        --maximum-removal-delta={{.MAX_REMOVAL_DELTA}}
        --require-self={{.REQUIRE_SELF}}
        {{if eq .CONFIRM "true"}}--confirm{{end}}
